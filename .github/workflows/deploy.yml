name: Auto Update Sitemap & Sync Repository

# Otomatis berjalan setiap ada push ke branch "main" (kecuali push dari bot sendiri)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sitemap:
    name: Verify & Auto-Update Sitemap in main
    # Mencegah infinite loop tanpa memakai [skip ci] (agar Cloudflare Pages tidak men-skip deploy)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Generate Automated Sitemap (public/sitemap.xml)
        run: node generate_sitemap.mjs

      - name: 4. Commit & Push Sitemap jika ada penambahan URL baru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if git diff --staged --quiet; then
            echo "✅ public/sitemap.xml sudah sinkron, langsung lanjut ke Cloudflare Pages."
          else
            git commit -m "chore(seo): auto-update public/sitemap.xml"
            git push origin HEAD:main
            echo "✅ Berhasil memperbarui public/sitemap.xml di branch main!"
          fi
